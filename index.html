<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<body>
<title>HUC Close-out Roadmap</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e3e7ee;--line2:#eef1f5;--hdr:#1f3a5f;--acc:#2f6fd6;
--KLWA:#2f6fd6;--AQWA:#d9822b;--CVWA:#2e9e6a;--wk:#f3f5f8;--today:#e5484d;--ok:#15803d;--warn:#c2410c;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--panel:#1a1e26;--ink:#e6e9ef;--mute:#98a1b3;--line:#2b313d;--line2:#232833;--hdr:#24426b;--wk:#20252e;--ok:#4ade80;--warn:#fb923c;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151b;--panel:#1a1e26;--ink:#e6e9ef;--mute:#98a1b3;--line:#2b313d;--line2:#232833;--hdr:#24426b;--wk:#20252e;--ok:#4ade80;--warn:#fb923c;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 20px 6px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{margin:2px 0 4px;font-size:21px}
.sub{color:var(--mute);max-width:1150px}
.tabs{display:flex;gap:2px;padding:0 20px;margin-top:8px}
.tab{padding:8px 16px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--bg);cursor:pointer;font-weight:600;color:var(--mute)}
.tab.on{background:var(--panel);color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px 4px;background:var(--panel)}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:110px}
.fact b{display:block;font-size:17px}.fact span{font-size:11px;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar label{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:4px}
select,input,button{font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
button{cursor:pointer}button:hover{border-color:var(--mute)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;gap:4px}.chip{padding:3px 9px;border-radius:12px;border:1px solid var(--line);cursor:pointer;user-select:none;font-size:12px}
.chip.on{color:#fff;border-color:transparent}
#wrap{overflow:auto;height:calc(100vh - 250px);min-height:420px;position:relative;background:var(--panel)}
#grid{position:relative}
.row{display:flex;height:24px;border-bottom:1px solid var(--line2)}
.left{position:sticky;left:0;z-index:5;width:var(--LW);min-width:var(--LW);display:flex;background:var(--panel);border-right:1px solid var(--line)}
.left>div{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:24px;flex:none}
.num{text-align:right}
.tl{position:relative;flex:none}
.hdrs{position:sticky;top:0;z-index:20;background:var(--panel)}
.hdrs .row{height:24px}.hdrs .left>div{font-weight:600;color:var(--mute);font-size:11px;position:relative}
.rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.rz:hover,.rz.act{background:var(--acc);opacity:.5}
.mon,.wkc{position:absolute;top:0;height:24px;line-height:24px;border-left:1px solid var(--line);padding-left:4px;font-size:11px;color:var(--mute);overflow:hidden;white-space:nowrap}
.mon{font-weight:600;color:var(--ink)}
.grp>.left{font-weight:600;background:var(--wk)}
.grp1>.left{background:color-mix(in srgb,var(--hdr) 13%,var(--panel))}
.tog{cursor:pointer;display:inline-block;width:14px;color:var(--mute)}
.b{position:absolute;top:5px;height:14px;border-radius:3px;min-width:3px}
.b.it{cursor:grab;touch-action:none}.b.it:hover{outline:2px solid var(--ink);outline-offset:1px}
.b.it.drag{cursor:grabbing;outline:2px dashed var(--ink);z-index:6}
.b.it .h{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize}.b.it .h.l{left:0}.b.it .h.r{right:0}
.b.it.done{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 3px,transparent 3px 7px)}
.b .lb{position:absolute;left:100%;margin-left:4px;white-space:nowrap;font-size:11px;color:var(--mute);top:-1px;pointer-events:none}
.b.ghost{top:9px;height:6px;background:none;border:1px dashed var(--mute);opacity:.7;pointer-events:none}
.vline{position:absolute;top:0;bottom:0;width:1px;background:var(--line2);pointer-events:none}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);opacity:.7;pointer-events:none;z-index:4}
#chartRow{height:150px;border-bottom:1px solid var(--line)}
#chartRow .left{flex-direction:column;justify-content:center;padding:8px 10px;gap:6px}
#chartRow .left>div,#chartRow .left>b{flex:none;padding:0;line-height:1.35;white-space:normal}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pill{display:inline-block;padding:0 7px;border-radius:9px;font-size:11px;line-height:17px;border:1px solid var(--line)}
.st-Done{color:var(--ok);border-color:var(--ok)}.st-In{color:var(--acc);border-color:var(--acc)}.st-Not{color:var(--mute)}
.mt-Pending{color:var(--warn)}.mt-Handed-Over,.mt-No{color:var(--ok)}
.od{color:var(--bad);font-weight:600}
.edm{color:var(--acc);font-weight:700}
.row.carry>.left{background:color-mix(in srgb,#f08c00 16%,var(--panel))}.row.carry>.left .cof{color:#e8590c;font-weight:700}
.lat tr.carry td.fx{background:color-mix(in srgb,#f08c00 16%,var(--panel))}
.cotag{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:#e8590c;border-radius:4px;padding:0 5px;margin-right:4px;line-height:15px}
#tip{position:fixed;z-index:99;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.18);border-radius:8px;padding:8px 10px;max-width:430px;display:none;font-size:12px}
#tip b{font-size:13px}#tip table{border-collapse:collapse;margin-top:4px}#tip td{padding:1px 8px 1px 0;vertical-align:top}#tip td:first-child{color:var(--mute)}
#drawer{position:fixed;right:0;top:0;bottom:0;width:380px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.15);z-index:60;transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .dh{padding:14px 16px;border-bottom:1px solid var(--line)}#drawer .db{padding:12px 16px;overflow:auto;flex:1}
#drawer .fr{display:grid;grid-template-columns:110px 1fr;gap:6px 8px;align-items:center;margin-bottom:10px}
#drawer .fr label{color:var(--mute);font-size:12px}
#drawer .info td{padding:2px 8px 2px 0;vertical-align:top;font-size:12px}#drawer .info td:first-child{color:var(--mute);white-space:nowrap}
#drawer .btns{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-top:1px solid var(--line)}
#kpi{display:none;padding:16px 20px 30px;background:var(--panel)}
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 18px}
.kc{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kc b{display:block;font-size:22px}.kc span{color:var(--mute);font-size:12px}
.kc.bad b{color:var(--bad)}.kc.ok b{color:var(--ok)}
table.kt{border-collapse:collapse;width:100%;margin:6px 0 18px;font-size:12px}
.kt th{background:var(--hdr);color:#fff;font-weight:600;padding:6px;text-align:right;white-space:nowrap}.kt th:first-child{text-align:left}
.kt td{padding:5px 6px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}.kt td:first-child{text-align:left}
.kt tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.kt .barc{display:inline-block;height:6px;border-radius:3px;background:var(--acc);vertical-align:middle;margin-left:6px}
.kgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
h3{margin:6px 0 4px;font-size:14px}
.ol tbody tr{cursor:pointer}.ol tbody tr:hover td{background:var(--wk)}
footer{padding:10px 20px 30px;color:var(--mute);font-size:12px}footer li{margin:2px 0}
.ovw{overflow:auto}
.role{font-size:12px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
#usersDlg{position:fixed;top:60px;right:16px;z-index:72;width:620px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:12px 14px;display:none}
#usersDlg.open{display:block}#usersDlg .hd{display:flex;justify-content:space-between;align-items:center}
.role.ed{border-color:var(--ok);color:var(--ok)}.role.co{border-color:var(--acc);color:var(--acc)}
.upd{font-size:12px;color:var(--mute);margin:-4px 0 10px}
.cbtn{font-size:11px;padding:1px 7px;line-height:16px;border-radius:9px;border:1px solid var(--ok);color:var(--ok);background:transparent;cursor:pointer;white-space:nowrap}
.cbtn:hover{background:var(--ok);color:#fff}.cbtn.re{border-color:var(--line);color:var(--mute)}.cbtn.re:hover{background:var(--wk);color:var(--ink)}
.sc{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:4px;line-height:16px}.sc-POS{background:#e7f0ff;color:#1c4fb8}.sc-PMC{background:#fff1e0;color:#b4570b}
#la{display:none;padding:14px 20px 30px;background:var(--panel)}
#laWrap{overflow:auto;max-height:calc(100vh - 300px);border:1px solid var(--line);border-radius:8px}
table.lat{border-collapse:separate;border-spacing:0;font-size:12px}
.lat th,.lat td{border-bottom:1px solid var(--line2);padding:3px 6px;white-space:nowrap;background:var(--panel)}
.lat thead th{position:sticky;top:0;z-index:3;background:var(--hdr);color:#fff;font-weight:600}
.lat thead tr.mp th{top:25px;background:var(--wk);color:var(--ink);font-weight:600}
.lat .fx{position:sticky;z-index:2}.lat thead .fx{z-index:4}
.lat td.d,.lat th.d{width:22px;min-width:22px;max-width:22px;padding:0;text-align:center;font-size:10px;border-left:1px solid var(--line2)}
.lat th.d.we{opacity:.75}.lat td.d.on{background-clip:padding-box}.lat td.d.today{box-shadow:inset 2px 0 0 var(--today)}
.lat tr.lg1 td{background:color-mix(in srgb,var(--hdr) 13%,var(--panel));font-weight:700}
.lat .de{max-width:260px;overflow:hidden;text-overflow:ellipsis}
@media print{.tabs,.bar,#dispBtn,.laCtl,.lang{display:none!important}#laWrap{max-height:none;overflow:visible}}
.dispbtn{margin-left:auto;align-self:center;margin-bottom:4px}
#disp{position:fixed;top:60px;right:16px;z-index:70;width:560px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:12px 14px;display:none}
#disp.open{display:block}#disp h4{margin:10px 0 4px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
#disp .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:2px 10px}#disp label{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:2px 0;cursor:pointer}
#disp input{padding:0}#disp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.compact .row{height:20px}.compact .left>div{line-height:20px}.compact .b{top:4px;height:12px}.compact .b.ghost{top:7px;height:5px}.compact .hdrs .row{height:22px}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.lang button{border:none;border-radius:0;padding:5px 12px;font-weight:600}.lang button.on{background:var(--acc);color:#fff}
@media (max-width:900px){.kgrid{grid-template-columns:1fr}}
@media (max-width:760px){header{padding:12px 16px}.bar{padding:8px 16px}.tabs{padding:0 16px}#kpi{padding:12px 16px}.facts{padding:10px 16px 4px}}
</style>

 const Wd=760,Hd=260,m={l:44,r:12,t:12,b:28},X=k=>m.l+k*(Wd-m.l-m.r)/Math.max(1,pts.length-1),Y=v=>Hd-m.b-v/tot*(Hd-m.t-m.b);

 pts.forEach((p,k)=>{if(k%Math.ceil(pts.length/10)===0)g+=`<text x="${X(k)}" y="${Hd-8}" font-size="10" text-anchor="middle" fill="var(--mute)">${fmtS(p.t)}</text>`});

 return `<h3>${tx('S-curve – cumulative items completed (weekly)')}</h3><div class="lg" style="margin-bottom:4px"><span><i style="background:var(--hdr)"></i>${tx('Planned (current dates)')}</span><span><i style="background:var(--ok)"></i>${tx('Actual (Done by actual finish)')}</span><span><i style="background:var(--today)"></i>${tx('Status date')}</span></div>

function buildDisp(){const d=$('disp');
 d.innerHTML=`<div class="hd"><b>${tx('Display settings')}</b><span><button id="dAll">${tx('Show all')}</button> <button id="dRst">${tx('Default')}</button> <button id="dX">✕</button></span></div>

// ---------- shared data & permissions (claude.ai artifact) ----------
async function saveFile(name,blob){try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
const dbErr=e=>alert_(tx('Not saved')+(e&&e.code==='not_granted'?' – '+tx('you have view-only access'):e&&e.code?' ('+e.code+')':''));
function persistS(id){if(SH.sb){const v=st[id],q=SH.sb.from('item_status');(v?q.upsert({item_id:id,status:v.status||'Not started',af:v.af||null,note:v.note||''}):q.delete().eq('item_id',id)).then(r=>{if(r.error)dbErr({code:r.error.code==='42501'?'not_granted':r.error.message})});return}
 if(!SH.db)return;const v=st[id],r=SH.db.doc('status/'+id);(v?r.set({status:v.status||'Not started',af:v.af||'',note:v.note||'',by:SH.uid||'',at:new Date().toISOString()}):r.delete()).catch(dbErr)}
function persistD(id){if(SH.sb){const v=ed.pa2[id],q=SH.sb.from('item_dates');(v?q.upsert({item_id:id,s:v.s,d:v.d}):q.delete().eq('item_id',id)).then(r=>{if(r.error)dbErr({code:r.error.code==='42501'?'not_granted':r.error.message})});return}
 if(!SH.db)return;const v=ed.pa2[id],r=SH.db.doc('dates/'+id);(v?r.set({s:v.s,d:v.d,by:SH.uid||'',at:new Date().toISOString()}):r.delete()).catch(dbErr)}
function applyPerm(){const r=$('role');
 $('btnUsers').hidden=!(SH.mode==='supa'&&SH.canD);$('btnOut').hidden=SH.mode!=='supa';
 if(SH.mode==='local'){r.className='role';r.textContent=tx('Offline copy – changes stay in this browser')}
 else if(SH.canD){r.className='role ed';r.textContent=tx('Editor – dates and status')}
 else if(SH.canS){r.className='role co';r.textContent=tx('Contributor – can update status')}
 else{r.className='role';r.textContent=tx('View only')}
 if(SH.mode==='supa'){r.title=SH.email||'';r.textContent=(SH.email||'')+' · '+r.textContent}
 $('imp').hidden=!SH.canS;$('resetAll').hidden=!SH.canD;$('undo').hidden=!SH.canD}
let rq=0;const soft=()=>{if(drag||rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})};
async function sbAll(table){let out=[],from=0;for(;;){const {data,error}=await SH.sb.from(table).select('*').range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
const sbSt=x=>({status:x.status||'Not started',af:x.af||'',note:x.note||'',by:x.updated_by||'',at:x.updated_at||''});
const PEOPLE={};
async function sbPeople(){try{const {data}=await SH.sb.from('profiles').select('id,email,full_name,role');(data||[]).forEach(p=>PEOPLE[p.id]=p)}catch(e){}}
async function nameOf(id){if(SH.sb){if(!PEOPLE[id])await sbPeople();const p=PEOPLE[id];return p?(p.full_name||p.email):''}if(SH.user){const p=await SH.user.profiles([id]);return (p[id]&&p[id].name)||''}return ''}
(async()=>{const C=window.HUC_CTX;if(!C)return;
 SH.sb=C.sb;SH.mode='supa';SH.uid=C.uid;SH.email=C.email;SH.role=C.role;SH.canS=['contributor','editor'].includes(C.role);SH.canD=C.role==='editor';st={};ed.pa2={};applyPerm();render();
 try{const [a,b]=await Promise.all([sbAll('item_status'),sbAll('item_dates')]);const m={};a.forEach(x=>m[x.item_id]=sbSt(x));st=m;const n={};b.forEach(x=>{if(x.s&&x.d)n[x.item_id]={s:x.s,d:+x.d}});ed.pa2=n;soft()}catch(e){alert_(tx('Shared status could not be loaded'))}
 sbPeople();
 SH.sb.channel('huc-roadmap')
  .on('postgres_changes',{event:'*',schema:'public',table:'item_status'},p=>{if(p.eventType==='DELETE')delete st[p.old.item_id];else st[p.new.item_id]=sbSt(p.new);soft()})
  .on('postgres_changes',{event:'*',schema:'public',table:'item_dates'},p=>{if(p.eventType==='DELETE')delete ed.pa2[p.old.item_id];else ed.pa2[p.new.item_id]={s:p.new.s,d:+p.new.d};soft()})
  .subscribe();
 $('btnOut').onclick=async()=>{await SH.sb.auth.signOut();location.reload()};
 $('btnUsers').onclick=openUsers;
})();
async function openUsers(){const d=$('usersDlg');d.classList.add('open');d.innerHTML=`<div class="hd"><b>${tx('Users and roles')}</b><button id="uX">✕</button></div><p style="color:var(--mute);font-size:12px">${tx('New sign-ups wait as Pending until you give them a role.')}</p><div id="uList">…</div>`;
 $('uX').onclick=()=>d.classList.remove('open');
 const {data,error}=await SH.sb.from('profiles').select('id,email,full_name,role').order('email');if(error){$('uList').textContent=error.message;return}
 const R=['pending','viewer','contributor','editor'];
 $('uList').innerHTML=`<table class="kt"><thead><tr><th>Email</th><th>${tx('Name')}</th><th>${tx('Role')}</th></tr></thead><tbody>${data.map(p=>`<tr><td style="text-align:left">${esc(p.email)}</td><td style="text-align:left">${esc(p.full_name||'')}</td><td><select data-u="${p.id}"${p.id===SH.uid?' disabled':''}>${R.map(r=>`<option value="${r}"${r===p.role?' selected':''}>${ui.lang==='vi'?tx('role:'+r):r[0].toUpperCase()+r.slice(1)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`;
 $('uList').querySelectorAll('select[data-u]').forEach(s=>s.onchange=async()=>{const {error}=await SH.sb.from('profiles').update({role:s.value}).eq('id',s.dataset.u);alert_(error?tx('Not saved')+': '+error.message:tx('Role updated'))})}
(async()=>{if(window.HUC_CTX||!(window.claude&&window.claude.use))return;
 const db=await window.claude.use('db');if(!db)return;
 SH.db=db;SH.mode='shared';st={};ed.pa2={};
 const user=await window.claude.use('user');SH.user=user;
 if(user){try{SH.uid=await user.id()}catch(e){}let ce=false,cw=null;try{ce=await user.canEdit()}catch(e){}try{cw=await user.can('data.write')}catch(e){}SH.canD=!!ce;SH.canS=!!ce||cw!==false}else{SH.canD=false;SH.canS=false}
 applyPerm();render();
 db.collection('status').onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data()||{};m[d.id]={status:x.status||'Not started',af:x.af||'',note:x.note||'',by:x.by||'',at:x.at||''}});st=m;soft()},e=>alert_(tx('Shared status could not be loaded')));
 db.collection('dates').onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data()||{};if(x.s&&x.d)m[d.id]={s:x.s,d:+x.d}});ed.pa2=m;soft()},e=>alert_(tx('Shared dates could not be loaded')));
})();
applyStatic();applyPerm();
render();
if(!load('-fit')){store('-fit',1);$('fit').click()}
</script>

<script>

window.HUC_SUPABASE = { url: "https://ptriflzzvrbnzuitclns.supabase.co/rest/v1/", anonKey: "" };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(()=>{const C=window.HUC_SUPABASE||{},G=document.getElementById('gate');
 let vi=false;try{vi=(JSON.parse(localStorage.getItem('hucCowRoadmap9-ui')||'{}').lang==='vi')||/lang=vi/.test(location.hash)}catch(e){}
 const T=(e,v)=>vi?v:e,E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const show=h=>{G.innerHTML='<div class="gcard"><div class="eyebrow">Block B Pack 2 · HUC</div><h2>'+T('HUC Close-out Roadmap','Lộ trình đóng hạng mục HUC')+'</h2>'+h+'</div>';G.hidden=false};
 const msg=(m,ok)=>{const e=document.getElementById('gmsg');if(e){e.textContent=m;e.className='msg '+(ok?'ok':'err')}};
 if(!C.url||!C.anonKey){show('<p>'+T('Not connected yet. Paste the Supabase Project URL and anon key into HUC_SUPABASE near the end of index.html.','Chưa kết nối. Dán Project URL và anon key của Supabase vào HUC_SUPABASE ở gần cuối file index.html.')+'</p>');return}
 if(!window.supabase||!window.supabase.createClient){show('<p>'+T('The sign-in library did not load. Check the internet connection, then reload the page.','Không tải được thư viện đăng nhập. Kiểm tra kết nối mạng rồi tải lại trang.')+'</p>');return}
 const sb=window.supabase.createClient(C.url,C.anonKey);let booted=false,busy=false;
 function loginForm(note){show(`<p>${T('Sign in with your company email.','Đăng nhập bằng email công ty.')}</p>
  <form id="gf"><label for="ge">Email</label><input id="ge" type="email" autocomplete="email" required>
  <label for="gp">${T('Password','Mật khẩu')}</label><input id="gp" type="password" autocomplete="current-password" required minlength="8">
  <div id="gnw" hidden><label for="gn">${T('Full name','Họ tên')}</label><input id="gn" autocomplete="name"></div>
  <div class="row2"><button class="pri" id="gin" type="submit">${T('Sign in','Đăng nhập')}</button><button type="button" id="gup">${T('Create account','Tạo tài khoản')}</button></div>
  <button type="button" class="lnk" id="gfg">${T('Forgot password?','Quên mật khẩu?')}</button><div id="gmsg" class="msg"></div></form>`);
  if(note)msg(note,true);
  const em=()=>document.getElementById('ge').value.trim(),pw=()=>document.getElementById('gp').value;
  document.getElementById('gf').onsubmit=async e=>{e.preventDefault();msg('');const {error}=await sb.auth.signInWithPassword({email:em(),password:pw()});if(error)msg(T('Sign-in failed: ','Đăng nhập không được: ')+error.message)};
  document.getElementById('gup').onclick=async()=>{const nw=document.getElementById('gnw');if(nw.hidden){nw.hidden=false;msg(T('Enter your name, then press Create account again.','Nhập họ tên rồi bấm Tạo tài khoản lần nữa.'),true);return}
   if(!em()||pw().length<8){msg(T('Enter your email and a password of at least 8 characters.','Nhập email và mật khẩu ít nhất 8 ký tự.'));return}
   const {data,error}=await sb.auth.signUp({email:em(),password:pw(),options:{data:{full_name:document.getElementById('gn').value.trim()},emailRedirectTo:location.origin+location.pathname}});
   if(error){msg(/database error/i.test(error.message)?T('Only company email addresses can sign up.','Chỉ email công ty mới đăng ký được.'):error.message);return}
   if(!data.session)msg(T('Account created. Open the confirmation email, then sign in.','Đã tạo tài khoản. Mở email xác nhận rồi đăng nhập.'),true)};
  document.getElementById('gfg').onclick=async()=>{if(!em()){msg(T('Enter your email first.','Nhập email trước.'));return}
   const {error}=await sb.auth.resetPasswordForEmail(em(),{redirectTo:location.origin+location.pathname});msg(error?error.message:T('Password reset email sent.','Đã gửi email đặt lại mật khẩu.'),!error)}}
 function newPass(){show(`<p>${T('Choose a new password.','Đặt mật khẩu mới.')}</p><form id="gnp"><label for="gp2">${T('New password','Mật khẩu mới')}</label><input id="gp2" type="password" minlength="8" required autocomplete="new-password"><div class="row2"><button class="pri" type="submit">${T('Save','Lưu')}</button></div><div id="gmsg" class="msg"></div></form>`);
  document.getElementById('gnp').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.updateUser({password:document.getElementById('gp2').value});if(error)msg(error.message);else location.reload()}}
 async function boot(session){if(booted||busy)return;busy=true;try{
  const uid=session.user.id,email=session.user.email;
  const {data:p}=await sb.from('profiles').select('role').eq('id',uid).maybeSingle();const role=p?p.role:'pending';
  if(role==='pending'){show(`<p>${T('Your account','Tài khoản')} <b>${E(email)}</b> ${T('is waiting for an editor to grant access.','đang chờ người biên tập cấp quyền.')}</p><div class="row2"><button id="gout">${T('Sign out','Đăng xuất')}</button><button id="grl">${T('Check again','Kiểm tra lại')}</button></div>`);
   document.getElementById('gout').onclick=async()=>{await sb.auth.signOut();location.reload()};document.getElementById('grl').onclick=()=>location.reload();return}
  show('<p>'+T('Loading the roadmap…','Đang tải lộ trình…')+'</p>');
  let items=[],from=0;for(;;){const {data,error}=await sb.from('items').select('data').order('ord').range(from,from+999);if(error)throw error;items=items.concat(data.map(r=>r.data));if(data.length<1000)break;from+=1000}
  const {data:m}=await sb.from('app_meta').select('value').eq('key','roadmap').maybeSingle();
  const J=(m&&m.value)||{hpd:8,crew:1,windows:[]};J.items=items;
  if(!items.length){show('<p>'+T('No items in the database yet. Run the supabase_items SQL files.','Chưa có hạng mục trong cơ sở dữ liệu. Hãy chạy các file SQL supabase_items.')+'</p>');return}
  document.getElementById('roadmap-data').textContent=JSON.stringify(J);
  window.HUC_CTX={sb,uid,email,role};booted=true;G.hidden=true;G.innerHTML='';
  const s=document.createElement('script');s.textContent=document.getElementById('app').textContent;document.body.appendChild(s);
 }catch(e){show('<p>'+T('Could not load data: ','Không tải được dữ liệu: ')+E(e.message||e)+'</p>')}finally{busy=false}}
 sb.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY'){setTimeout(newPass,0);return}
  if(session)setTimeout(()=>boot(session),0);else if(!booted)setTimeout(()=>loginForm(),0)});
})();
</script>
