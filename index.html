<title>HUC Close-out Roadmap</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e3e7ee;--line2:#eef1f5;--hdr:#1f3a5f;--acc:#2f6fd6;
--KLWA:#2f6fd6;--AQWA:#d9822b;--CVWA:#2e9e6a;--wk:#f3f5f8;--today:#e5484d;--ok:#15803d;--warn:#c2410c;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--panel:#1a1e26;--ink:#e6e9ef;--mute:#98a1b3;--line:#2b313d;--line2:#232833;--hdr:#24426b;--wk:#20252e;--ok:#4ade80;--warn:#fb923c;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#12151b;--panel:#1a1e26;--ink:#e6e9ef;--mute:#98a1b3;--line:#2b313d;--line2:#232833;--hdr:#24426b;--wk:#20252e;--ok:#4ade80;--warn:#fb923c;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 20px 6px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{margin:2px 0 4px;font-size:21px}
.sub{color:var(--mute);max-width:1150px}
.tabs{display:flex;gap:2px;padding:0 20px;margin-top:8px}
.tab{padding:8px 16px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--bg);cursor:pointer;font-weight:600;color:var(--mute)}
.tab.on{background:var(--panel);color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px 4px;background:var(--panel)}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:110px}
.fact b{display:block;font-size:17px}.fact span{font-size:11px;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar label{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:4px}
select,input,button{font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
button{cursor:pointer}button:hover{border-color:var(--mute)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;gap:4px}.chip{padding:3px 9px;border-radius:12px;border:1px solid var(--line);cursor:pointer;user-select:none;font-size:12px}
.chip.on{color:#fff;border-color:transparent}
#wrap{overflow:auto;height:calc(100vh - 250px);min-height:420px;position:relative;background:var(--panel)}
#grid{position:relative}
.row{display:flex;height:24px;border-bottom:1px solid var(--line2)}
.left{position:sticky;left:0;z-index:5;width:var(--LW);min-width:var(--LW);display:flex;background:var(--panel);border-right:1px solid var(--line)}
.left>div{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:24px;flex:none}
.num{text-align:right}
.tl{position:relative;flex:none}
.hdrs{position:sticky;top:0;z-index:20;background:var(--panel)}
.hdrs .row{height:24px}.hdrs .left>div{font-weight:600;color:var(--mute);font-size:11px;position:relative}
.rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.rz:hover,.rz.act{background:var(--acc);opacity:.5}
.mon,.wkc{position:absolute;top:0;height:24px;line-height:24px;border-left:1px solid var(--line);padding-left:4px;font-size:11px;color:var(--mute);overflow:hidden;white-space:nowrap}
.mon{font-weight:600;color:var(--ink)}
.grp>.left{font-weight:600;background:var(--wk)}
.grp1>.left{background:color-mix(in srgb,var(--hdr) 13%,var(--panel))}
.tog{cursor:pointer;display:inline-block;width:14px;color:var(--mute)}
.b{position:absolute;top:5px;height:14px;border-radius:3px;min-width:3px}
.b.it{cursor:grab;touch-action:none}.b.it:hover{outline:2px solid var(--ink);outline-offset:1px}
.b.it.drag{cursor:grabbing;outline:2px dashed var(--ink);z-index:6}
.b.it .h{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize}.b.it .h.l{left:0}.b.it .h.r{right:0}
.b.it.done{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 3px,transparent 3px 7px)}
.b .lb{position:absolute;left:100%;margin-left:4px;white-space:nowrap;font-size:11px;color:var(--mute);top:-1px;pointer-events:none}
.b.ghost{top:9px;height:6px;background:none;border:1px dashed var(--mute);opacity:.7;pointer-events:none}
.vline{position:absolute;top:0;bottom:0;width:1px;background:var(--line2);pointer-events:none}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);opacity:.7;pointer-events:none;z-index:4}
#chartRow{height:150px;border-bottom:1px solid var(--line)}
#chartRow .left{flex-direction:column;justify-content:center;padding:8px 10px;gap:6px}
#chartRow .left>div,#chartRow .left>b{flex:none;padding:0;line-height:1.35;white-space:normal}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pill{display:inline-block;padding:0 7px;border-radius:9px;font-size:11px;line-height:17px;border:1px solid var(--line)}
.st-Done{color:var(--ok);border-color:var(--ok)}.st-In{color:var(--acc);border-color:var(--acc)}.st-Not{color:var(--mute)}
.mt-Pending{color:var(--warn)}.mt-Handed-Over,.mt-No{color:var(--ok)}
.od{color:var(--bad);font-weight:600}
.edm{color:var(--acc);font-weight:700}
.row.carry>.left{background:color-mix(in srgb,#f08c00 16%,var(--panel))}.row.carry>.left .cof{color:#e8590c;font-weight:700}
.lat tr.carry td.fx{background:color-mix(in srgb,#f08c00 16%,var(--panel))}
.cotag{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:#e8590c;border-radius:4px;padding:0 5px;margin-right:4px;line-height:15px}
#tip{position:fixed;z-index:99;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.18);border-radius:8px;padding:8px 10px;max-width:430px;display:none;font-size:12px}
#tip b{font-size:13px}#tip table{border-collapse:collapse;margin-top:4px}#tip td{padding:1px 8px 1px 0;vertical-align:top}#tip td:first-child{color:var(--mute)}
#drawer{position:fixed;right:0;top:0;bottom:0;width:380px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.15);z-index:60;transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .dh{padding:14px 16px;border-bottom:1px solid var(--line)}#drawer .db{padding:12px 16px;overflow:auto;flex:1}
#drawer .fr{display:grid;grid-template-columns:110px 1fr;gap:6px 8px;align-items:center;margin-bottom:10px}
#drawer .fr label{color:var(--mute);font-size:12px}
#drawer .info td{padding:2px 8px 2px 0;vertical-align:top;font-size:12px}#drawer .info td:first-child{color:var(--mute);white-space:nowrap}
#drawer .btns{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-top:1px solid var(--line)}
#kpi{display:none;padding:16px 20px 30px;background:var(--panel)}
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 18px}
.kc{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kc b{display:block;font-size:22px}.kc span{color:var(--mute);font-size:12px}
.kc.bad b{color:var(--bad)}.kc.ok b{color:var(--ok)}
table.kt{border-collapse:collapse;width:100%;margin:6px 0 18px;font-size:12px}
.kt th{background:var(--hdr);color:#fff;font-weight:600;padding:6px;text-align:right;white-space:nowrap}.kt th:first-child{text-align:left}
.kt td{padding:5px 6px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}.kt td:first-child{text-align:left}
.kt tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.kt .barc{display:inline-block;height:6px;border-radius:3px;background:var(--acc);vertical-align:middle;margin-left:6px}
.kgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
h3{margin:6px 0 4px;font-size:14px}
.ol tbody tr{cursor:pointer}.ol tbody tr:hover td{background:var(--wk)}
footer{padding:10px 20px 30px;color:var(--mute);font-size:12px}footer li{margin:2px 0}
.ovw{overflow:auto}
.cbtn{font-size:11px;padding:1px 7px;line-height:16px;border-radius:9px;border:1px solid var(--ok);color:var(--ok);background:transparent;cursor:pointer;white-space:nowrap}
.cbtn:hover{background:var(--ok);color:#fff}.cbtn.re{border-color:var(--line);color:var(--mute)}.cbtn.re:hover{background:var(--wk);color:var(--ink)}
.sc{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:4px;line-height:16px}.sc-POS{background:#e7f0ff;color:#1c4fb8}.sc-PMC{background:#fff1e0;color:#b4570b}
#la{display:none;padding:14px 20px 30px;background:var(--panel)}
#laWrap{overflow:auto;max-height:calc(100vh - 300px);border:1px solid var(--line);border-radius:8px}
table.lat{border-collapse:separate;border-spacing:0;font-size:12px}
.lat th,.lat td{border-bottom:1px solid var(--line2);padding:3px 6px;white-space:nowrap;background:var(--panel)}
.lat thead th{position:sticky;top:0;z-index:3;background:var(--hdr);color:#fff;font-weight:600}
.lat thead tr.mp th{top:25px;background:var(--wk);color:var(--ink);font-weight:600}
.lat .fx{position:sticky;z-index:2}.lat thead .fx{z-index:4}
.lat td.d,.lat th.d{width:22px;min-width:22px;max-width:22px;padding:0;text-align:center;font-size:10px;border-left:1px solid var(--line2)}
.lat th.d.we{opacity:.75}.lat td.d.on{background-clip:padding-box}.lat td.d.today{box-shadow:inset 2px 0 0 var(--today)}
.lat tr.lg1 td{background:color-mix(in srgb,var(--hdr) 13%,var(--panel));font-weight:700}
.lat .de{max-width:260px;overflow:hidden;text-overflow:ellipsis}
@media print{.tabs,.bar,#dispBtn,.laCtl,.lang{display:none!important}#laWrap{max-height:none;overflow:visible}}
.dispbtn{margin-left:auto;align-self:center;margin-bottom:4px}
#disp{position:fixed;top:60px;right:16px;z-index:70;width:560px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:12px 14px;display:none}
#disp.open{display:block}#disp h4{margin:10px 0 4px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
#disp .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:2px 10px}#disp label{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:2px 0;cursor:pointer}
#disp input{padding:0}#disp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.compact .row{height:20px}.compact .left>div{line-height:20px}.compact .b{top:4px;height:12px}.compact .b.ghost{top:7px;height:5px}.compact .hdrs .row{height:22px}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.lang button{border:none;border-radius:0;padding:5px 12px;font-weight:600}.lang button.on{background:var(--acc);color:#fff}
@media (max-width:900px){.kgrid{grid-template-columns:1fr}}
@media (max-width:760px){header{padding:12px 16px}.bar{padding:8px 16px}.tabs{padding:0 16px}#kpi{padding:12px 16px}.facts{padding:10px 16px 4px}}
</style>

 for(const p of PL){const pl=list.filter(i=>i.plat===p);if(!pl.length)continue;
  body+=`<tr class="lg1"><td class="fx" style="left:0" colspan="${F.length}">${p} · ${pl.length} ${tx('items')}</td>${days.map(()=>'<td class="d"></td>').join('')}</tr>`;
  for(const i of pl){const c=cur(i),S=stat(i),od=overdue(i),col=color('plat',i.plat);
   const v=[(i.carry&&S!=='Done'?`<span class="cotag">${tx('Oct')}</span>`:'')+esc(i.id),esc(i.item),`<span title="${esc(i.desc)}">${esc(i.desc)}</span>`,esc(tyL(i.type)),`<span class="sc sc-${esc(i.scope)}">${esc(i.scope)}</span>`,esc(dL(i.disc)),`<span class="mt-${esc(i.mat.split(' ')[0])}">${esc(mL(i.mat))}</span>`,fmtS(c.s),`<span class="${od?'od':''}">${fmtS(c.f)}</span>`,`<span class="pill st-${S.split(' ')[0]}">${tx(S)}</span>`,cbtn(i)];
   body+=`<tr data-id="${i.id}"${i.carry&&S!=='Done'?` class="carry" title="${esc(tx('Carry-over from Oct 1MLA')+': '+coR(i))}"`:''}>${v.map((h,k)=>`<td class="fx${k===2?' de':''}" style="left:${fx[k]}px;min-width:${F[k][1]||260}px;max-width:${F[k][1]||260}px">${h}</td>`).join('')}${days.map(d=>{const on=d>=c.s&&d<=c.f;return `<td class="d${on?' on':''}${d===TODAY?' today':''}"${on?` style="background:${S==='Done'?'#9fd5b0':col}"`:''}></td>`}).join('')}</tr>`}}
 if(!body)body=`<tr><td colspan="${F.length+N}" style="text-align:center;color:var(--mute);padding:14px">${tx('No items in this window')}</td></tr>`;
 $('la').innerHTML=`<div class="laCtl" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px">
  <label style="color:var(--mute)">${tx('From')} <input type="date" id="laF" value="${ISO(from)}"></label><button id="laT">${tx('Today')}</button><button id="laP">◀</button><button id="laNx">▶</button>
  <label style="color:var(--mute)">${tx('Span')} <select id="laN">${opt(String(N),[['14','14 '+tx('days')],['30','30 '+tx('days')],['42','42 '+tx('days')]])}</select></label>
  <label style="color:var(--mute)">${tx('Platform')} <select id="laPl">${opt(ui.laPl,[['',tx('All')],...PL.map(p=>[p,p])])}</select></label>
  <label style="color:var(--mute)">${tx('Type')} <select id="laTy">${opt(ui.laTy,[['',tx('All')],['COW','COW'],['PL',tx('Punchlist')],['PD','Post-Drilling']])}</select></label>
  <label style="color:var(--mute)">${tx('Scope')} <select id="laSc">${opt(ui.laSc,[['',tx('All')],['POS','POS'],['PMC','PMC']])}</select></label>
  <label style="color:var(--mute)"><input type="checkbox" id="laD" style="padding:0"${ui.laDone?' checked':''}> ${tx('Show done')}</label>
  <button id="laCsv">${tx('Export CSV')}</button><button id="laPr">${tx('Print')}</button></div>
  <h3 style="margin:0 0 6px">${tx('1-Month Look-ahead')}: ${fmt(from)} → ${fmt(to)}</h3>
  <div class="kcards" data-v="la_cards" style="margin:6px 0 12px">${cards.map(([a,b])=>`<div class="kc"><b>${a}</b><span>${tx(b)}</span></div>`).join('')}</div>
  <div id="laWrap"><table class="lat"><thead><tr>${th}${dh}</tr>${mpr}</thead><tbody>${body}</tbody></table></div>`;
 const sv=(id,k,num)=>$(id).onchange=e=>{ui[k]=e.target.type==='checkbox'?e.target.checked:(num?+e.target.value:e.target.value);render()};
 sv('laF','laFrom');sv('laN','laN',1);sv('laPl','laPl');sv('laTy','laTy');sv('laSc','laSc');sv('laD','laDone');
 $('laT').onclick=()=>{ui.laFrom='';render()};$('laP').onclick=()=>{ui.laFrom=ISO(from-7*DAY);render()};$('laNx').onclick=()=>{ui.laFrom=ISO(from+7*DAY);render()};$('laPr').onclick=()=>window.print();
 $('laCsv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const H=['ID','Platform','Type','Scope','Discipline','Item ID','Tag No','Description','Material Status','Start','Finish','Status','Actual Finish'];
  const rows=list.map(i=>{const c=cur(i);return [i.id,i.plat,tyL(i.type),i.scope,dL(i.disc),i.item,i.tag,i.desc,mL(i.mat),ISO(c.s),ISO(c.f),tx(stat(i)),st[i.id]&&st[i.id].af||''].map(q).join(',')});
  const b=new Blob(['﻿'+[H.map(h=>q(tx(h))).join(','),...rows].join('\r\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`HUC_1MLA_${ISO(from)}.csv`;a.click()};
 $('la').querySelectorAll('tr[data-id] td.fx').forEach(td=>td.onclick=e=>{if(e.target.closest('[data-close]'))return;openDrawer(td.parentElement.dataset.id)});
}

// ---------- display settings ----------
const VIS=[['Roadmap',[['sub','Description under the title'],['facts','Summary cards'],['chart','Daily manloading chart'],['weeks','Week row'],['labels','Bar labels'],['today','Status-date line'],['ghost','Original dates of edited bars'],['notes','Notes at the bottom']]],
 ['Columns',[['col_id','ID'],['col_it','Item'],['col_de','Description'],['col_sc','Scope'],['col_mt','Material'],['col_st','Status'],['col_ac','Close button'],['col_s','Start'],['col_f','Finish'],['col_du','Days']]],
 ['Toolbar',[['t_colour','Colour'],['t_chartby','Chart by'],['t_plats','Platform buttons'],['t_disc','Discipline filter'],['t_mat','Material filter'],['t_scope','Scope filter'],['t_type','Type filter'],['t_status','Status filter'],['t_search','Search box'],['t_zoom','Zoom + Fit'],['t_undo','Undo'],['t_expand','Expand / Collapse'],['t_csv','Export / Import CSV'],['t_reset','Reset edits']]],
 ['1-Month Look-ahead',[['la_cards','Summary cards']]],
 ['KPI',[['k_cards','KPI cards'],['k_plat','By platform'],['k_type','By type'],['k_scope','By scope'],['k_disc','By discipline'],['k_scurve','S-curve'],['k_next','Next 2 weeks'],['k_carry','Carry-over from Oct 1MLA'],['k_overdue','Overdue items']]]];
(()=>{let css='';VIS.forEach(([,l])=>l.forEach(([k])=>css+=`body.h-${k} [data-v="${k}"]{display:none!important}\n`));const s=document.createElement('style');s.textContent=css;document.head.appendChild(s)})();
function applyVis(){VIS.forEach(([,l])=>l.forEach(([k])=>document.body.classList.toggle('h-'+k,!!ui.hide[k])));document.body.classList.toggle('compact',!!ui.compact)}
function buildDisp(){const d=$('disp');
 d.innerHTML=`<div class="hd"><b>${tx('Display settings')}</b><span><button id="dAll">${tx('Show all')}</button> <button id="dRst">${tx('Default')}</button> <button id="dX">✕</button></span></div>
 <label style="margin-top:6px"><input type="checkbox" id="dCompact"${ui.compact?' checked':''}> ${tx('Compact rows')}</label>`+
 VIS.map(([g,l])=>`<h4>${tx(g==='Roadmap'?'Roadmap':g)}</h4><div class="g">${l.map(([k,lab])=>`<label><input type="checkbox" data-k="${k}"${ui.hide[k]?'':' checked'}> ${tx(lab)}</label>`).join('')}</div>`).join('');
 d.querySelectorAll('input[data-k]').forEach(c=>c.onchange=()=>{if(c.checked)delete ui.hide[c.dataset.k];else ui.hide[c.dataset.k]=true;applyVis();render()});
 $('dCompact').onchange=e=>{ui.compact=e.target.checked;applyVis();render()};
 $('dAll').onclick=()=>{ui.hide={};applyVis();buildDisp();render()};$('dRst').onclick=()=>{ui.hide={sub:true};ui.compact=false;applyVis();buildDisp();render()};$('dX').onclick=()=>d.classList.remove('open')}
$('dispBtn').onclick=e=>{e.stopPropagation();const d=$('disp');if(d.classList.toggle('open'))buildDisp()};
document.addEventListener('click',e=>{const d=$('disp');if(d.classList.contains('open')&&!d.contains(e.target)&&e.target.id!=='dispBtn')d.classList.remove('open')});
applyVis();
applyStatic();
render();
if(!load('-fit')){store('-fit',1);$('fit').click()}
</script>
</body>
</html>
